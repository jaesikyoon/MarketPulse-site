<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>MarketPulse — 운영 일시 중단</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #1a1a2e;
            --heading: #16213e;
            --muted: #6c757d;
            --faint: #adb5bd;
            --line: #f1f3f5;
            --accent: #4361ee;
            --dot: #f59e0b;
            --shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12131a;
                --card: #1b1d27;
                --text: #e6e8ef;
                --heading: #f2f4f8;
                --muted: #9aa1b1;
                --faint: #6b7280;
                --line: #2a2d3a;
                --accent: #8ea2ff;
                --dot: #fbbf24;
                --shadow: 0 2px 12px rgba(0,0,0,0.4);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.8;
            color: var(--text);
            background: var(--bg);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 560px;
            background: var(--card);
            border-radius: 12px;
            padding: 48px 40px;
            box-shadow: var(--shadow);
        }
        .brand {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 20px;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--dot);
            box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5);
            animation: pulse 2.4s ease-out infinite;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.5); }
            70%  { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        @media (prefers-reduced-motion: reduce) {
            .dot { animation: none; }
        }
        h1 {
            font-size: 1.6rem;
            line-height: 1.45;
            color: var(--heading);
            margin-bottom: 16px;
        }
        p {
            color: var(--muted);
            margin-bottom: 14px;
        }
        .items {
            list-style: none;
            border-top: 1px solid var(--line);
            margin-top: 28px;
            padding-top: 8px;
        }
        .items li {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            font-size: 0.95rem;
        }
        .items .label { color: var(--text); }
        .items .value { color: var(--faint); font-size: 0.85rem; white-space: nowrap; }
        footer {
            margin-top: 28px;
            color: var(--faint);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">MarketPulse</div>

        <div class="status"><span class="dot"></span>운영 일시 중단</div>
        <h1>현재 서비스를 중단하고<br>다음 버전을 준비하고 있습니다.</h1>

        <p>일일 시장 브리핑과 뉴스 수집 자동화를 모두 멈춘 상태입니다. 새로운 분석은 갱신되지 않습니다.</p>
        <p>구조를 다시 설계한 뒤 새 버전으로 돌아오겠습니다.</p>

        <ul class="items">
            <li><span class="label">일일 시장 브리핑</span><span class="value">중단</span></li>
            <li><span class="label">관심 종목·주제 뉴스 수집</span><span class="value">중단</span></li>
            <li><span class="label">다음 버전</span><span class="value">준비 중</span></li>
        </ul>

        <footer>마지막 갱신 2026년 8월 24일 · LLM 기반 주식 시장 자동 분석</footer>
    </div>
</body>
</html>
